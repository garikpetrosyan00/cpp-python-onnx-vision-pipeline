<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">CPU vision pipeline architecture</title>
  <desc id="desc">Shared media and YOLOX detector stages implemented in Python and C++, with parity and benchmark outputs.</desc>
  <style>
    .bg { fill: #f8fafc; } .title { font: 700 28px sans-serif; fill: #0f172a; }
    .sub { font: 16px sans-serif; fill: #475569; } .box { stroke-width: 2; rx: 12; }
    .shared { fill: #e0f2fe; stroke: #0284c7; } .runtime { fill: #ede9fe; stroke: #7c3aed; }
    .output { fill: #dcfce7; stroke: #16a34a; } .label { font: 700 17px sans-serif; fill: #0f172a; }
    .note { font: 14px sans-serif; fill: #334155; } .path { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    .lane { font: 700 16px sans-serif; fill: #0369a1; } .lane2 { font: 700 16px sans-serif; fill: #6d28d9; }
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#475569"/></marker></defs>
  <rect class="bg" width="1200" height="590"/>
  <text class="title" x="50" y="52">Audited CPU vision pipeline</text>
  <text class="sub" x="50" y="80">Shared YOLOX-Nano contract: BGR 0–255 → 416×416 letterbox → raw decode → class-aware NMS</text>
  <text class="lane" x="50" y="126">Shared media path</text>
  <rect class="box shared" x="50" y="145" width="150" height="78"/><text class="label" x="89" y="180">Input source</text><text class="note" x="75" y="205">image · video · camera</text>
  <rect class="box shared" x="255" y="145" width="155" height="78"/><text class="label" x="281" y="180">Preprocess</text><text class="note" x="277" y="205">letterbox + NCHW</text>
  <rect class="box runtime" x="465" y="145" width="165" height="78"/><text class="label" x="492" y="180">ONNX Runtime</text><text class="note" x="505" y="205">CPU provider only</text>
  <rect class="box shared" x="685" y="145" width="170" height="78"/><text class="label" x="715" y="180">Postprocess</text><text class="note" x="711" y="205">decode · scores · NMS</text>
  <rect class="box output" x="910" y="145" width="205" height="78"/><text class="label" x="944" y="180">Render / output</text><text class="note" x="937" y="205">display · image · video</text>
  <path class="path" d="M200 184H255M410 184H465M630 184H685M855 184H910"/>
  <text class="lane" x="50" y="300">Python</text><rect class="box shared" x="145" y="270" width="260" height="58"/><text class="label" x="175" y="305">OpenCV + NumPy + ORT</text>
  <text class="lane2" x="50" y="385">C++</text><rect class="box runtime" x="145" y="355" width="260" height="58"/><text class="label" x="184" y="390">OpenCV + ORT C++ API</text>
  <path class="path" d="M405 299H520V245H770"/><path class="path" d="M405 384H560V245H770"/>
  <rect class="box output" x="825" y="270" width="290" height="58"/><text class="label" x="856" y="305">Canonical detection JSON</text>
  <rect class="box output" x="825" y="355" width="290" height="58"/><text class="label" x="859" y="390">Benchmark JSON + CSV</text>
  <path class="path" d="M770 245V299H825M770 245V384H825"/>
  <text class="note" x="826" y="446">Parity: ordered detections, labels, confidence, boxes</text>
  <text class="note" x="826" y="470">Benchmark: matched source, model, thresholds, warm-up, CPU provider</text>
  <text class="sub" x="50" y="540">No GPU providers, batching, web service, Docker, or cloud deployment are part of the completed core.</text>
</svg>
