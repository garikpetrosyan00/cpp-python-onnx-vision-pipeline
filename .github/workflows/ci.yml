name: ci

on:
  push:
  pull_request:

jobs:
  python-bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install package
        run: python -m pip install -e './python[dev]'
      - name: Lint
        run: ruff check python
      - name: Test
        run: pytest python/tests
      - name: Check CLI
        run: python -m vision_pipeline --help

  cpp-bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - name: Set up pinned ONNX Runtime
        run: scripts/setup_cpp.sh
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DONNXRUNTIME_ROOT="$PWD/third_party/onnxruntime"
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure
